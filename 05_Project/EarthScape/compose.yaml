services:
  earthscape:
    platform: linux/amd64
    build: .
    ports:
      - "127.0.0.1:8081:8080"
      - "127.0.0.1:9870:9870"
      - "127.0.0.1:8088:8088"
    volumes:
      - earthscape-data:/app/runtime
      - earthscape-cluster:/app/cluster-runtime
    environment:
      EARTHSCAPE_ADMIN_PASSWORD: EarthDemo!2026
      EARTHSCAPE_ANALYST_PASSWORD: AnalystDemo!2026
      EARTHSCAPE_VIEWER_PASSWORD: ViewerDemo!2026
    mem_limit: 6g
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080',timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3
volumes:
  earthscape-data:
  earthscape-cluster:
